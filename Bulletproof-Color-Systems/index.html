<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build bulletproof color systems</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>contrast-color()</h1>
  <p>A great feature for components that need to work with multiple themes</p>
  <div class="button-group">
    <button class="button" data-theme="default">A default button</button>
    <button class="button" data-theme="primary">Primary button</button>
    <button class="button" data-theme="accent">Accent button</button>
  </div>
</body>

</html>
